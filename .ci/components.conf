# Path rules for .ci/changed-components.sh (see its --help for the syntax).
# Each component is one job in .github/workflows/ci.yml. Files that match no rule trigger nothing
# (README, LICENSE, logo/, design/, Dockerfile, ...).

# CI wiring: changing how CI runs re-runs everything.
_all: .github/workflows/ci.yml .ci/**

# Maven reactor. The Java job narrows the build to the touched modules with .ci/maven-projects.sh.
java: pom.xml .mvn/** mvnw mvnw.cmd .java-version configure/** \
      client/** core/** convert/** driver/** executor/** fs/** lib/** notify/** parser/** plugin/** \
      scheduler/** shaded/** test/** \
      !core/metaforge-web/** !core/metaforge-ui/** !core/pnpm-lock.yaml !core/pnpm-workspace.yaml \
      !**/*.md

# Metadata persistence suite against every database the setup wizard offers.
persistence: pom.xml .mvn/** mvnw core/metaforge-service/** core/metaforge-server/pom.xml \
             core/metaforge-server/src/** \
             !**/*.md

# pnpm workspace: component library and web app.
web: core/metaforge-web/** core/metaforge-ui/** core/pnpm-lock.yaml core/pnpm-workspace.yaml \
     !**/*.md

# Documentation site.
docs: docs/**
