################################### Banner configure #################################
app.version=2026.0.0

################################### Basic configure #################################
server.port=9096
server.address=0.0.0.0
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
metaforge.security.secret=MetaForgeSecretKey
metaforge.security.expiration=86400000
metaforge.editor.sugs.maxSize=1000

################################ Web configure #################################
spring.mvc.throw-exception-if-no-handler-found=true
spring.resources.add-mappings=false
spring.web.resources.add-mappings=true

################################ Database configure #################################
# Intentionally empty: without an external database the server boots on the
# embedded H2 store and the first-boot setup wizard (/setup) configures the
# real datasource, persisted to ./configure/application.properties.
# spring.datasource.url=jdbc:mysql://host:3306/metaforge?...
# spring.datasource.username=
# spring.datasource.password=
# The metadata schema is migrated by MetaForge itself (DatabaseMigrator), never by Boot.
spring.liquibase.enabled=false

################################ Cache configure #################################
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0

################################ Metaforge defaults #################################
metaforge.registration.enable=true
metaforge.captcha.enable=true
metaforge.cache.maximum=10000
metaforge.cache.expiration=2
metaforge.pipeline.maxRunning=100
metaforge.pipeline.maxQueue=200
metaforge.experimental.autoLimit=true
metaforge.experimental.data={user.dir}/data
metaforge.experimental.avatarPath={username}/avatar/
metaforge.parser.sql.defaultEngine=Trino
metaforge.audit.sql.print=false
plugin.manager.extend.packages=com.fasterxml.jackson
# 0 = automatic (up to 4 workers), 1 = sequential
plugin.manager.load-threads=0
