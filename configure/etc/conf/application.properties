################################### Banner configure #################################
app.version=2026.0.0

################################### Basic configure #################################
server.port=9096
# Note: If you need to use IP+ port to facilitate access by external machines, do not set it to localhost, 0.0.0.0 is recommended
server.address=localhost
# Fixed serialized data missing for 8 hours
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
# metaforge security management configuration
metaforge.security.secret=MetaForgeSecretKey
metaforge.security.expiration=86400000
# metaforge editor configuration
metaforge.editor.sugs.maxSize=1000

################################ Web configure #################################
# Forwarding system preset related errors to custom processing
spring.mvc.throw-exception-if-no-handler-found=true
spring.resources.add-mappings=false
spring.web.resources.add-mappings=true

################################ Database configure #################################
# If you enable MySQL storage, please modify the following configuration
# If version >=8.x please set allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://localhost:3306/metaforge?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true&useSSL=false&useOldAliasMetadataBehavior=true&jdbcCompliantTruncation=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678

################################ Cache configure #################################
# Set redis environment
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
# If your server sets an authorization password
# please open the following configuration and enter the password of your server
# spring.redis.password=

################################ Executor configure #################################
# Executor configuration (formerly metaforge.executor.*) is now stored in the database table
# metaforge_configure (category=EXECUTOR, name=<Local|Seatunnel|...>). Defaults come from each
# ExecutorPlugin's configures() SPI declaration and are auto-seeded on first startup.
# Edit via the admin "Runtime Configuration" page at /system/configure.

################################ Upload configure #################################
metaforge.config.data=
metaforge.cache.data=

############################### OpenAI configure #################################
metaforge.openai.backend=https://api.openai.com
metaforge.openai.token=
# Support list:
#        GPT_35_TURBO
#        GPT_35_TURBO_0301
#        GPT_35_TURBO_0613
#        GPT_35_TURBO_16K
#        GPT_35_TURBO_16K_0613
#        GPT_4
#        GPT_4_0314
#        GPT_4_32K
#        GPT_4_32K_0314
#        GPT_4_0613
#        GPT_4_32K_0613
#        GPT_4O
metaforge.openai.model=GPT_35_TURBO_0613
# Access remote API timeout, in seconds
metaforge.openai.timeout=30

############################### System configure #################################
# Whether to enable new user registration
metaforge.registration.enable=
# Whether to enable the verification code, the location where the verification code is enabled is registration & login
metaforge.captcha.enable=
# Buffering the maximum number of storages requires expanding the JVM memory
metaforge.cache.maximum=100000
# Unit minutes
metaforge.cache.expiration=5
# Whether to print the currently executed SQL
metaforge.audit.sql.print=false

################################# Pipeline configure #################################
# Maximum number of pipeline running
metaforge.pipeline.maxRunning=100
# Maximum number of pipeline queue
metaforge.pipeline.maxQueue=200
# When the service is restarted, the status of the pipeline with status RUNNING is reset.
metaforge.pipeline.reset=STOPPED

################################# DataSet configure #################################
# Dataset target storage configuration (formerly metaforge.dataset.*) is now stored in
# metaforge_configure (category=DATASET, name=Default). Defaults come from DatasetTargetSchema
# and are auto-seeded on first startup. Edit via /system/configure.

################################# Plugin configure #################################
metaforge.parser.sql.defaultEngine=Trino

################################# File System configure #################################
# For the file storage type, please refer to metaforge-fs-<Type>, which defaults to Local
# ------ Local File System ------ #
metaforge.fs.type=LocalFs
metaforge.fs.access=
metaforge.fs.secret=
metaforge.fs.endpoint=
metaforge.fs.bucket=

# ------ Qiniu File System ------#
