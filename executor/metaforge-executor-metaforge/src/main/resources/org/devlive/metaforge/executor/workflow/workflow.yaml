# Workflow declaration of the MetaForge executor. The server reads it from this plugin's own jar.
description: Runs the pipeline inside the MetaForge server, reading and writing through saved data sources.
topology: pipeline
capabilities:
  # cooperative: the executor stops the task itself; interrupt: the server interrupts the worker thread.
  stop: cooperative
  rowCount: true
  metrics: true
  preview: true
limits:
  sources: 1
  transforms: 0
  sinks: 1
# Metrics reported by MetricsCollector (ExecutorMetrics field names). rowsFailed and rowsSkipped are
# never filled by this executor, so they are not listed. Keep this list, the web metric registry
# (model/workflow-metrics.ts) and the collector in step.
metrics:
  - rowsRead
  - rowsWritten
  - totalRows
  - progress
  - etaSeconds
  - bytesRead
  - bytesWritten
  - readRowsPerSecond
  - writeRowsPerSecond
  - avgReadRowsPerSecond
  - avgWriteRowsPerSecond
  - peakWriteRowsPerSecond
  - readBytesPerSecond
  - writeBytesPerSecond
  - batchesCommitted
  - avgBatchMs
  - channels
  - queue
  - readerWaitMs
  - writerWaitMs
  - throttleWaitMs
  - bottleneck
  - stages
  - series
# Job settings filled per workflow; empty values fall back to the executor's runtime configuration.
settings:
  - field: fetchSize
    label: Fetch size
    type: number
    min: 1
    description: Rows fetched from the source per round trip. Leave empty to use the executor configuration.
  - field: batchSize
    label: Batch size
    type: number
    min: 1
    description: Rows flushed to the target per batch. Leave empty to use the executor configuration.
  - field: queueCapacity
    label: Queue capacity
    type: number
    min: 1
    description: Batches buffered between reading and writing.
  - field: preCount
    label: Count rows first
    type: switch
    value: true
    description: Count the source rows before transferring, so the total and progress are known from the start. Turn it off for very large sources where counting is slow.
  - field: concurrency
    label: Parallel channels
    type: number
    min: 1
    max: 16
    description: Read/write channels running at once, each with its own connections. More than one needs a split column. Leave empty to use the executor configuration.
  - field: splitStrategy
    label: Split strategy
    type: select
    description: NONE keeps one query, AUTO splits when channels are above one, RANGE always splits. Queries that cannot be split safely stay as one query.
    options:
      - label: NONE
        value: NONE
      - label: AUTO
        value: AUTO
      - label: RANGE
        value: RANGE
  - field: splitColumn
    label: Split column
    type: input
    description: Integer or date source column to split the query on, ideally indexed and evenly spread.
  - field: splitCount
    label: Split count
    type: number
    min: 0
    max: 256
    description: Number of ranges. Leave empty or 0 to use four per channel.
  - field: maxRowsPerSecond
    label: Max rows per second
    type: number
    min: 0
    description: Upper limit on rows read per second across all channels. 0 means no limit.
  - field: maxBytesPerSecond
    label: Max bytes per second
    type: number
    min: 0
    description: Upper limit on estimated bytes read per second across all channels. 0 means no limit.
nodes:
  - nodes/metaforge-source.yaml
  - nodes/metaforge-sink.yaml
