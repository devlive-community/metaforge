name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue on MetaForge!
            Please make sure the issue contains a clear description, the
            MetaForge version and the steps to reproduce it. A maintainer
            will take a look as soon as possible.
          pr-message: |
            Thanks for opening your first pull request on MetaForge!
            Please make sure the change is covered by tests and follows the
            contribution guidelines. A maintainer will review it shortly.
